version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agrivision
      POSTGRES_USER: agrivision
      POSTGRES_PASSWORD: agrivision
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.example
    volumes:
      - ./backend:/app
    ports:
      - '8000:8000'
    depends_on:
      - db

volumes:
  postgres_data:
