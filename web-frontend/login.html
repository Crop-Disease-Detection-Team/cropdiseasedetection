<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Login | Crop Disease AI</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('https://images.pexels.com/photos/259280/pexels-photo-259280.jpeg?auto=compress&cs=tinysrgb&w=1600') center/cover no-repeat;
      position: relative;
      padding: 1.5rem;
    }

    /* dark overlay for readability */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, rgba(30, 40, 30, 0.65) 0%, rgba(20, 30, 20, 0.75) 100%);
      z-index: 0;
    }

    /* login card */
    .login-card {
      position: relative;
      z-index: 2;
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(0px);
      border-radius: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .login-card:hover {
      transform: translateY(-4px);
    }

    /* header */
    .card-header {
      background: linear-gradient(145deg, #2C5F2D 0%, #1F4820 100%);
      padding: 2rem;
      text-align: center;
      color: white;
    }

    .logo-icon {
      font-size: 2.8rem;
      display: inline-block;
      margin-bottom: 0.5rem;
    }

    .card-header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }

    .card-header p {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    /* body */
    .card-body {
      padding: 2rem 2rem 2rem;
      background: white;
    }

    /* form groups */
    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6B5B4A;
      margin-bottom: 0.4rem;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #B0A090;
      font-size: 1rem;
      transition: color 0.2s;
    }

    input {
      width: 100%;
      padding: 12px 14px 12px 44px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      border: 1.5px solid #E8E2D4;
      border-radius: 14px;
      background: white;
      transition: all 0.2s;
      outline: none;
    }

    input:focus {
      border-color: #2C5F2D;
      box-shadow: 0 0 0 3px rgba(44, 95, 45, 0.1);
    }

    input.error {
      border-color: #DC6B5A;
    }

    .error-message {
      font-size: 0.7rem;
      color: #DC6B5A;
      margin-top: 5px;
      margin-left: 4px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    /* forgot password link */
    .forgot-link {
      text-align: right;
      margin: -0.5rem 0 1.25rem;
    }

    .forgot-link a {
      font-size: 0.75rem;
      color: #9A8A78;
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-link a:hover {
      color: #2C5F2D;
      text-decoration: underline;
    }

    /* button */
    .btn-login {
      width: 100%;
      padding: 13px;
      background: #2C5F2D;
      color: white;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover {
      background: #1F4820;
      transform: translateY(-1px);
    }

    /* alert */
    .alert {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 1.2rem;
      font-size: 0.85rem;
    }

    .alert.show {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .alert-error {
      background: #FFEEED;
      border: 1px solid #F0CFCA;
      color: #B84C3C;
    }

    .alert-success {
      background: #E6F3E8;
      border: 1px solid #BDD9B2;
      color: #2E6B3A;
    }

    hr {
      margin: 1.5rem 0 1rem;
      border: none;
      border-top: 1px solid #E8E2D4;
    }

    .register-link {
      text-align: center;
      font-size: 0.8rem;
      color: #9A8A78;
    }

    .register-link a {
      color: #2C5F2D;
      font-weight: 600;
      text-decoration: none;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 550px) {
      .card-body {
        padding: 1.5rem;
      }
      .card-header {
        padding: 1.5rem;
      }
      .card-header h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="card-header">
    <div class="logo-icon"></div>
    <h1>Welcome back</h1>
    <p>Sign in to your account</p>
  </div>
  <div class="card-body">

    <!-- Alert message -->
    <div id="alertMessage" class="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label>Email address</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="farmer@example.com" autocomplete="email">
        </div>
        <div id="emailError" class="error-message"></div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
        </div>
        <div id="passwordError" class="error-message"></div>
      </div>

      <div class="forgot-link">
        <a href="forgot-password.html">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span>Sign in</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </form>

    <hr>

    <div class="register-link">
      Don't have an account? <a href="register.html">Create account →</a>
    </div>

  </div>
</div>

<script>
  const API_URL = 'http://localhost:5000/api';

  // DOM elements
  const emailField = document.getElementById('email');
  const passwordField = document.getElementById('password');
  const alertDiv = document.getElementById('alertMessage');
  const loginBtn = document.getElementById('loginBtn');

  function showAlert(message, type) {
    alertDiv.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i> ${message}`;
    alertDiv.className = `alert alert-${type} show`;
    setTimeout(() => alertDiv.classList.remove('show'), 5000);
  }

  function showError(fieldId, message) {
    const errorDiv = document.getElementById(`${fieldId}Error`);
    errorDiv.textContent = message;
    errorDiv.classList.add('show');
    document.getElementById(fieldId).classList.add('error');
  }

  function clearErrors() {
    document.querySelectorAll('.error-message').forEach(el => {
      el.classList.remove('show');
      el.textContent = '';
    });
    document.querySelectorAll('input').forEach(el => el.classList.remove('error'));
  }

  // Form submission
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();

    const email = emailField.value.trim();
    const password = passwordField.value;

    // Email validation
    if (!email) {
      showError('email', 'Email address is required');
      return;
    }
    const emailPattern = /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/;
    if (!emailPattern.test(email)) {
      showError('email', 'Invalid email format');
      return;
    }

    // Password validation
    if (!password) {
      showError('password', 'Password is required');
      return;
    }

    // Disable button temporarily
    const originalBtnText = loginBtn.innerHTML;
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

    try {
      const response = await fetch(`${API_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (response.ok) {
        // FR05 – Store JWT token and user data
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('refresh_token', data.refresh_token);
        localStorage.setItem('user', JSON.stringify(data.user));

        showAlert('Login successful! Redirecting...', 'success');

        setTimeout(() => {
          if (data.user.role === 'admin') {
            window.location.href = 'admin-dashboard.html';
          } else {
            window.location.href = 'user-dashboard.html';
          }
        }, 1500);
      } else {
        showAlert(data.error || 'Invalid email or password', 'error');
        loginBtn.disabled = false;
        loginBtn.innerHTML = originalBtnText;
      }
    } catch (error) {
      console.error('Login error:', error);
      showAlert('Network error. Please check if backend is running.', 'error');
      loginBtn.disabled = false;
      loginBtn.innerHTML = originalBtnText;
    }
  });

  // Optional: pre-fill demo credentials for quick testing (remove in production)
  // emailField.value = 'bikram204sharma@gmail.com';
  // passwordField.value = 'Admin@123';
</script>
</body>
</html>
