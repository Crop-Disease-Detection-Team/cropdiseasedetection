<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Disease Detail — Crop Disease AI | Nepal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* ── all existing styles (unchanged) ── */
    :root {
      --green-dark: #0f2b14;
      --green-primary: #2c6e2f;
      --green-light: #4c9a4a;
      --cream-bg: #FDF9F0;
      --sand: #e9e0d3;
      --stone: #5e4b3c;
      --gray-soft: #f5f2ec;
      --shadow-sm: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05);
      --transition: all 0.2s ease;
      --radius-xl: 24px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream-bg);
      color: var(--stone);
      min-height: 100vh;
    }
    body.np-font { font-family: 'Noto Sans Devanagari', sans-serif; }

    .lang-switch-inline {
      background: var(--gray-soft);
      border-radius: 60px;
      padding: 6px 12px;
      font-size: 0.72rem;
      font-weight: 600;
      border: 1px solid var(--sand);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      color: var(--stone);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .lang-switch-inline:hover { background: var(--sand); }
    .lang-switch-inline svg { width: 14px; height: 14px; color: var(--green-primary); flex-shrink: 0; }

    .navbar {
      background: white;
      padding: 0.75rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--sand);
      position: sticky;
      top: 0;
      z-index: 99;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .logo { font-size: 1.1rem; font-weight: 800; color: var(--green-primary); flex-shrink: 0; }
    .navbar-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: nowrap;
      flex-shrink: 0;
    }
    .navbar-right a {
      color: var(--stone);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.85rem;
      transition: var(--transition);
      white-space: nowrap;
    }
    .navbar-right a:hover { color: var(--green-primary); }

    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem 3rem; }

    .detail-card {
      background: white;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--sand);
      overflow: hidden;
      display: flex;
      flex-direction: row;
      min-height: 500px;
    }

    .sidebar-tabs {
      width: 220px;
      background: var(--green-dark);
      padding: 1.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
    }
    .sidebar-tabs .tab-btn {
      background: transparent;
      border: none;
      padding: 0.8rem 1.5rem;
      text-align: left;
      font-weight: 600;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      transition: var(--transition);
      border-left: 3px solid transparent;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }
    .sidebar-tabs .tab-btn i {
      width: 20px;
      font-size: 0.95rem;
      text-align: center;
    }
    .sidebar-tabs .tab-btn:hover {
      background: rgba(255,255,255,0.08);
      color: white;
    }
    .sidebar-tabs .tab-btn.active {
      background: rgba(255,255,255,0.12);
      color: white;
      border-left-color: var(--green-light);
    }

    .right-content {
      flex: 1;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .detail-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.8rem;
    }
    .detail-header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--green-primary);
      margin-bottom: 0.2rem;
    }
    .detail-header .sci-name {
      font-style: italic;
      opacity: 0.75;
      font-size: 0.9rem;
    }
    .detail-header .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.3rem;
    }

    .hero-img-container {
      width: 100%;
      background: var(--gray-soft);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.5rem 0 1.5rem 0;
      padding: 0.5rem;
      min-height: 200px;
      max-height: 400px;
    }
    .hero-img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }
    .no-image {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      color: var(--stone);
      opacity: 0.5;
      text-align: center;
      padding: 2rem;
      width: 100%;
      height: 100%;
    }
    .no-image i { font-size: 2.5rem; }
    .no-image span { font-size: 0.9rem; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .info-section { margin-bottom: 1.5rem; }
    .info-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--stone);
      opacity: 0.6;
      margin-bottom: 0.3rem;
      font-weight: 700;
    }
    .info-value {
      font-size: 0.95rem;
      color: var(--stone);
      line-height: 1.8;
    }
    /* ── Bullet point styles ── */
    .info-value ul {
      margin: 0;
      padding-left: 1.2rem;
      list-style: none;
    }
    .info-value ul li {
      margin-bottom: 0.3rem;
      position: relative;
      padding-left: 0.5rem;
    }
    .info-value ul li::before {
      content: "•";
      position: absolute;
      left: -0.8rem;
      color: var(--green-primary);
      font-weight: 700;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }

    .med-card {
      background: var(--gray-soft);
      border-radius: var(--radius-md);
      padding: 1rem;
      border: 1px solid var(--sand);
      transition: var(--transition);
    }
    .med-card:hover { background: #eef4ea; }
    .med-name { font-weight: 800; color: var(--green-primary); margin-bottom: 0.4rem; font-size: 0.95rem; }
    .med-row {
      font-size: 0.78rem;
      color: var(--stone);
      margin: 0.25rem 0;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.85;
    }
    .med-row i { width: 18px; text-align: center; }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .badge-info { background: #e8f0fe; color: #1a5b8d; }
    .badge-critical { background: #fef2f2; color: #991b1b; }
    .badge-high { background: #fff7ed; color: #c2410c; }
    .badge-medium { background: #fefce8; color: #854d0e; }
    .badge-low { background: #f0fdf4; color: #166534; }

    .btn {
      padding: 10px 20px;
      border-radius: var(--radius-md);
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .btn-sm { padding: 6px 14px; font-size: 0.75rem; }
    .btn-primary { background: var(--green-primary); color: white; }
    .btn-primary:hover { background: #1f5922; transform: translateY(-1px); }
    .btn-secondary { background: var(--gray-soft); color: var(--stone); border: 1px solid var(--sand); }
    .btn-secondary:hover { background: var(--sand); }

    .loading-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--sand);
      border-top-color: var(--green-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-txt { margin-top: 1rem; color: var(--stone); font-size: 0.88rem; }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      margin-bottom: 1rem;
      font-size: 0.8rem;
      display: none;
    }
    .alert.success { background: #e8f5e9; border-left: 4px solid var(--green-primary); color: #1e4620; display: block; }
    .alert.error { background: #fef2f2; border-left: 4px solid #dc2626; color: #991b1b; display: block; }

    .not-found {
      text-align: center;
      padding: 4rem;
      color: var(--stone);
    }
    .not-found i { font-size: 2.5rem; opacity: 0.4; display: block; margin-bottom: 1rem; }

    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--sand);
    }

    @media (max-width: 820px) {
      .detail-card {
        flex-direction: column;
      }
      .sidebar-tabs {
        width: 100%;
        flex-direction: row;
        padding: 0.5rem 1rem;
        overflow-x: auto;
        gap: 4px;
        background: var(--green-dark);
      }
      .sidebar-tabs .tab-btn {
        padding: 0.6rem 1rem;
        border-left: none;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .sidebar-tabs .tab-btn.active {
        border-left: none;
        border-bottom-color: var(--green-light);
        background: rgba(255,255,255,0.08);
      }
      .right-content {
        padding: 1.2rem;
      }
      .hero-img-container {
        max-height: 250px;
        min-height: 150px;
      }
      .grid-2 { grid-template-columns: 1fr; }
      .navbar { padding: 0.6rem 1rem; }
      .lang-switch-inline span { display: none; }
      .lang-switch-inline { padding: 6px 8px; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="logo">CropDisease AI</div>
  <div class="navbar-right">
    <div class="lang-switch-inline" id="langToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 8l6 6"/><path d="M4 14l6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/>
        <path d="M22 22l-5-10-5 10"/><path d="M14 18h6"/>
      </svg>
      <span id="langBtnText">नेपाली</span>
    </div>
    <a href="/user-dashboard" id="backLink">← <span data-lang-key="dd_back_dashboard">Back to Dashboard</span></a>
    <button class="btn btn-secondary btn-sm" id="favBtn" onclick="toggleFav()">
      <i class="far fa-heart"></i> <span id="favText" data-lang-key="dd_save">Save</span>
    </button>
  </div>
</nav>

<div class="container">
  <div id="alertMsg" class="alert"></div>

  <div class="loading-overlay" id="loader">
    <div class="spinner"></div>
    <div class="loading-txt" data-lang-key="dd_loading">Loading disease details...</div>
  </div>

  <div id="content" style="display:none;">
    <div class="detail-card">

      <!-- LEFT SIDEBAR -->
      <div class="sidebar-tabs">
        <button class="tab-btn active" data-tab="0"><i class="fas fa-info-circle"></i> <span data-lang-key="dd_tab_overview">Overview</span></button>
        <button class="tab-btn" data-tab="1"><i class="fas fa-pills"></i> <span data-lang-key="dd_tab_treatment">Treatment</span></button>
        <button class="tab-btn" data-tab="2"><i class="fas fa-capsules"></i> <span data-lang-key="dd_tab_medicines">Medicines</span></button>
      </div>

      <!-- RIGHT CONTENT -->
      <div class="right-content">

        <!-- Header -->
        <div class="detail-header">
          <div>
            <h1 id="diseaseName"></h1>
            <div class="sci-name" id="sciName"></div>
            <div class="tags" id="tagRow"></div>
          </div>
        </div>

        <!-- Image -->
        <div id="heroImageContainer" class="hero-img-container"></div>

        <!-- Tab panels -->
        <div id="tab0" class="tab-panel active">
          <div class="info-section"><div class="info-label" data-lang-key="dd_description">Description</div><div class="info-value" id="dDesc"></div></div>
          <div class="info-section"><div class="info-label" data-lang-key="dd_symptoms">Symptoms</div><div class="info-value" id="dSymp"></div></div>
          <div class="info-section"><div class="info-label" data-lang-key="dd_causes">Causes</div><div class="info-value" id="dCause"></div></div>
          <div class="grid-2">
            <div class="info-section"><div class="info-label" data-lang-key="dd_affected_parts">Affected Parts</div><div class="info-value" id="dParts"></div></div>
            <div class="info-section"><div class="info-label" data-lang-key="dd_typical_duration">Typical Duration</div><div class="info-value" id="dDur"></div></div>
            <div class="info-section"><div class="info-label" data-lang-key="dd_cultivation_regions">Cultivation Regions</div><div class="info-value" id="dRegions"></div></div>
          </div>
        </div>

        <div id="tab1" class="tab-panel">
          <div class="info-section"><div class="info-label" data-lang-key="dd_organic_treatment">Organic Treatment</div><div class="info-value" id="dOrganic"></div></div>
          <div class="info-section"><div class="info-label" data-lang-key="dd_chemical_treatment">Chemical Treatment</div><div class="info-value" id="dChem"></div></div>
          <div class="info-section"><div class="info-label" data-lang-key="dd_prevention_tips">Prevention Tips</div><div class="info-value" id="dPrev"></div></div>
        </div>

        <div id="tab2" class="tab-panel">
          <div id="medGrid" class="grid-2" style="gap:1rem;"></div>
        </div>

        <!-- Action buttons -->
        <div class="action-buttons">
          <a href="/predict" class="btn btn-primary"><i class="fas fa-camera"></i> <span data-lang-key="dd_scan_crop">Scan Your Crop</span></a>
          <a href="/user-dashboard" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> <span data-lang-key="dd_back_dashboard">Back to Dashboard</span></a>
        </div>

      </div><!-- /right-content -->
    </div><!-- /detail-card -->
  </div><!-- /content -->

  <!-- Not Found -->
  <div id="notFound" class="not-found" style="display:none;">
    <i class="fas fa-exclamation-circle"></i>
    <p data-lang-key="dd_not_found_title">Disease not found.</p>
    <a href="/user-dashboard" style="color:var(--green-primary);margin-top:1rem;display:inline-block;">
      <i class="fas fa-arrow-left"></i> <span data-lang-key="dd_back_dashboard">Back to Dashboard</span>
    </a>
  </div>
</div>

<script src="/statics/js/auth.js"></script>
<script src="/statics/js/shared.js"></script>
<script>
  requireAuth('user');

  // ── Language toggle ──
  document.getElementById('langToggle').addEventListener('click', () => {
    if (typeof window.LangManager !== 'undefined') {
      const newLang = window.LangManager.currentLang === 'en' ? 'np' : 'en';
      window.LangManager.setLanguage(newLang);
    }
  });

  function updateLangButtonText() {
    const btnText = document.getElementById('langBtnText');
    if (btnText && typeof window.LangManager !== 'undefined') {
      btnText.innerText = window.LangManager.currentLang === 'en' ? 'नेपाली' : 'English';
    }
  }

  window.addEventListener('langApplied', () => {
    updateLangButtonText();
    if (currentDisease) render(currentDisease);
    updateFavBtn();
  });

  document.addEventListener('DOMContentLoaded', () => {
    if (typeof window.LangManager !== 'undefined') setTimeout(updateLangButtonText, 100);
  });

  // ── Helpers ──
  function esc(str) {
    if (!str) return '—';
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
  function fmt(str) { return str ? String(str).replace(/___/g,' — ').replace(/_/g,' ') : '—'; }

  // ── FIXED: Format text with bullet points ──
  function renderTextWithBullets(text, translationMap) {
    if (!text || text === '—' || text === 'Not specified' || text === 'dd_not_specified') return text;
    
    // If it already has HTML, return as-is
    if (text.includes('<ul') || text.includes('<li') || text.includes('<br')) return text;
    
    // ── FIX: Split by ? or ; or newline ──
    let parts = text.split(/[?;\n]/).filter(line => line.trim());
    
    if (parts.length > 1) {
      let html = '<ul style="margin:0;padding-left:1.2rem;list-style:none;">';
      parts.forEach(line => {
        let cleanText = line.replace(/^[•\-\*]\s*/, '').trim();
        if (cleanText) {
          // Try to translate if map exists
          if (translationMap && translationMap[cleanText]) {
            cleanText = translationMap[cleanText];
          }
          html += `<li style="margin-bottom:0.3rem;position:relative;padding-left:0.5rem;">
            <span style="position:absolute;left:-0.8rem;color:var(--green-primary);font-weight:700;">•</span> 
            ${esc(cleanText)}
          </li>`;
        }
      });
      html += '</ul>';
      return html;
    }
    
    // Single line - translate if map exists
    if (translationMap && translationMap[text]) {
      return esc(translationMap[text]);
    }
    
    return esc(text);
  }

  // ── State ──
  const qid = new URLSearchParams(location.search).get('id');
  let diseaseId = null, isFav = false, currentDisease = null;
  let activeTab = 0;

  // ── Tab switching ──
  document.querySelectorAll('.sidebar-tabs .tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const tabIndex = parseInt(this.getAttribute('data-tab'), 10);
      showTab(tabIndex);
    });
  });

  function showTab(index) {
    activeTab = index;
    document.querySelectorAll('.sidebar-tabs .tab-btn').forEach((btn, i) => {
      btn.classList.toggle('active', i === index);
    });
    document.querySelectorAll('.tab-panel').forEach((panel, i) => {
      panel.classList.toggle('active', i === index);
    });
  }

  // ── Load disease ──
  async function load() {
    if (!qid) {
      document.getElementById('notFound').style.display = 'block';
      document.getElementById('loader').style.display = 'none';
      return;
    }

    document.getElementById('loader').style.display = 'flex';
    document.getElementById('content').style.display = 'none';

    try {
      const res = await authFetch(`/api/disease/user/diseases/${qid}`);
      if (!res.ok) throw new Error('Not found');
      const d = await res.json();
      diseaseId = d.id;
      currentDisease = d;
      render(d);
      document.getElementById('loader').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      await checkFav();
    } catch {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('notFound').style.display = 'block';
    }
  }

  // ── Render ──
  function render(d) {
    // Get current language
    const lang = window.LangManager ? window.LangManager.currentLang : 'en';
    const isNp = lang === 'np';

    // ── Get ALL translation maps ──
    const diseaseNameMap = isNp ? (window.LangManager.get('disease_names') || {}) : {};
    const descMap = isNp ? (window.LangManager.get('disease_descriptions') || {}) : {};
    const sympMap = isNp ? (window.LangManager.get('disease_symptoms') || {}) : {};
    const causeMap = isNp ? (window.LangManager.get('disease_causes') || {}) : {};
    const organicMap = isNp ? (window.LangManager.get('organic_treatments') || {}) : {};
    const chemicalMap = isNp ? (window.LangManager.get('chemical_treatments') || {}) : {};
    const preventionMap = isNp ? (window.LangManager.get('prevention_tips') || {}) : {};
    const partsMap = isNp ? (window.LangManager.get('affected_parts') || {}) : {};
    const durationMap = isNp ? (window.LangManager.get('typical_duration') || {}) : {};
    const regionsMap = isNp ? (window.LangManager.get('cultivation_regions') || {}) : {};
    
    const medNameMap = isNp ? (window.LangManager.get('medicine_names') || {}) : {};
    const activeIngMap = isNp ? (window.LangManager.get('active_ingredients') || {}) : {};
    const typeMap = isNp ? (window.LangManager.get('medicine_types') || {}) : {};
    const appMethodMap = isNp ? (window.LangManager.get('application_methods') || {}) : {};
    const safetyMap = isNp ? (window.LangManager.get('medicine_safety') || {}) : {};
    const mfrMap = isNp ? (window.LangManager.get('medicine_manufacturers') || {}) : {};
    const cropNameMap = isNp ? (window.LangManager.get('crop_names') || {}) : {};

    // ── Translate disease name ──
    let diseaseName = fmt(d.disease_name);
    if (diseaseNameMap && diseaseNameMap[d.disease_name]) {
      diseaseName = diseaseNameMap[d.disease_name];
    }
    document.title = diseaseName + ' — Crop Disease AI';
    document.getElementById('diseaseName').textContent = diseaseName;
    document.getElementById('sciName').textContent = d.scientific_name || '';

    // ── Translate crop type ──
    let cropType = d.crop_type || t('dd_various');
    if (cropNameMap && cropNameMap[d.crop_type]) {
      cropType = cropNameMap[d.crop_type];
    }

    // Image
    const imgContainer = document.getElementById('heroImageContainer');
    const imageUrl = d.sample_image_url;
    if (imageUrl && imageUrl.trim()) {
      imgContainer.innerHTML = `<img src="${imageUrl}" class="hero-img" alt=""
        onerror="this.parentElement.innerHTML='<div class=\\'no-image\\'><i class=\\'fas fa-leaf\\'></i><span>${esc(t('dd_no_image'))}</span></div>'">`;
    } else {
      imgContainer.innerHTML = `<div class="no-image"><i class="fas fa-leaf"></i><span>${esc(t('dd_no_image'))}</span></div>`;
    }

    // Badges
    const severityMap = { critical:'badge-critical', high:'badge-high', medium:'badge-medium', low:'badge-low' };
    const sevKey = (d.severity_level || 'medium').toLowerCase();
    const sevClass = severityMap[sevKey] || 'badge-medium';
    const sevLabelKey = { critical:'sev_critical', high:'sev_high', medium:'sev_medium', low:'sev_low' }[sevKey] || 'sev_medium';
    document.getElementById('tagRow').innerHTML = `
      <span class="badge badge-info">${esc(cropType)}</span>
      <span class="badge ${sevClass}">${esc(t(sevLabelKey))} ${esc(t('dd_severity_suffix'))}</span>
    `;

    // ── Info fields with bullet point formatting and translation ──
    const setText = (id, val, map) => {
      const el = document.getElementById(id);
      if (el) {
        if (val && val.trim()) {
          el.innerHTML = renderTextWithBullets(val, map);
        } else {
          el.textContent = t('dd_not_specified');
        }
      }
    };
    
    setText('dDesc', d.description, descMap);
    setText('dSymp', d.symptoms, sympMap);
    setText('dCause', d.causes, causeMap);
    setText('dParts', d.affected_crop_parts, partsMap);
    setText('dDur', d.typical_duration, durationMap);
    setText('dRegions', d.cultivation_regions, regionsMap);
    setText('dOrganic', d.organic_treatment, organicMap);
    setText('dChem', d.chemical_treatment, chemicalMap);
    setText('dPrev', d.prevention_tips, preventionMap);

    // ── MEDICINES ──
    const meds = d.medicines || [];
    const medGrid = document.getElementById('medGrid');

    medGrid.innerHTML = meds.length ? meds.map(m => {
      const name = medNameMap[m.medicine_name] || m.medicine_name || '—';
      const ingredient = activeIngMap[m.active_ingredient] || m.active_ingredient || '—';
      const type = typeMap[m.type] || m.type || '—';
      const method = appMethodMap[m.application_method] || m.application_method || '—';
      const safety = safetyMap[m.safety_precautions] || m.safety_precautions || '—';
      const manufacturer = mfrMap[m.manufacturer] || m.manufacturer || '—';

      return `
        <div class="med-card">
          <div class="med-name">${esc(name)}</div>
          <div class="med-row"><i class="fas fa-flask"></i> ${esc(ingredient)}</div>
          <div class="med-row"><i class="fas fa-tag"></i> ${esc(type)}</div>
          <div class="med-row"><i class="fas fa-spray-can"></i> ${esc(method)}</div>
          <div class="med-row"><i class="fas fa-vial"></i> ${esc(m.dosage_per_liter || '—')}</div>
          ${m.waiting_period_days ? `<div class="med-row"><i class="fas fa-clock"></i> ${m.waiting_period_days} ${esc(t('dd_pre_harvest'))}</div>` : ''}
          ${safety !== '—' ? `<div class="med-row"><i class="fas fa-shield-alt"></i> ${esc(safety)}</div>` : ''}
          ${manufacturer !== '—' ? `<div class="med-row"><i class="fas fa-industry"></i> ${esc(manufacturer)}</div>` : ''}
          ${m.is_organic ? `<span class="badge badge-low" style="margin-top:6px;">${esc(t('dd_organic_label'))}</span>` : ''}
        </div>`;
    }).join('') : `<p style="color:var(--stone);opacity:.7;grid-column:1/-1;">${esc(t('dd_no_medicines'))}</p>`;

    showTab(activeTab);
  }

  // ── Favourites ──
  async function checkFav() {
    try {
      const res = await authFetch('/api/user/favorites');
      if (!res.ok) return;
      const data = await res.json();
      isFav = (data.favorites || []).some(f => f.disease && f.disease.id === diseaseId);
      updateFavBtn();
    } catch(e) { console.error(e); }
  }

  function updateFavBtn() {
    const btn = document.getElementById('favBtn');
    const span = document.getElementById('favText');
    if (!btn || !span) return;
    if (isFav) {
      btn.className = 'btn btn-primary btn-sm';
      btn.innerHTML = `<i class="fas fa-heart"></i> <span id="favText">${esc(t('dd_saved'))}</span>`;
    } else {
      btn.className = 'btn btn-secondary btn-sm';
      btn.innerHTML = `<i class="far fa-heart"></i> <span id="favText">${esc(t('dd_save'))}</span>`;
    }
  }

  async function toggleFav() {
    const method = isFav ? 'DELETE' : 'POST';
    try {
      const res = await authFetch(`/api/user/favorites/${diseaseId}`, { method });
      if (res.ok) {
        isFav = !isFav;
        updateFavBtn();
        showAlert('alertMsg', isFav ? t('dd_saved_to_favorites') : t('dd_removed_from_favorites'), 'success');
      }
    } catch(e) { console.error(e); }
  }

  function showAlert(id, msg, type) {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = `alert ${type}`;
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => { if (el) el.style.display = 'none'; }, 4000);
  }

  // ── Start ──
  load();
</script>
</body>
</html>
