<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Crop Disease Detector</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .container { max-width: 500px; margin: 0 auto; padding: 2rem; }
        .otp-input { letter-spacing: 5px; font-size: 24px; text-align: center; }
        .alert { padding: 12px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .alert.show { display: block; }
        .alert-error { background-color: #F8D7DA; color: #721C24; border: 1px solid #F5C6CB; }
        .alert-success { background-color: #D4EDDA; color: #155724; border: 1px solid #C3E6CB; }
        .timer { text-align: center; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <span class="logo-icon"></span>
                <span class="logo-text">CropDisease AI</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header"> Verify Your Email</div>
            <div class="card-body">
                <div id="alertMessage" class="alert"></div>
                
                <p>Enter the verification code sent to: <strong id="userEmail"></strong></p>
                
                <div class="form-group">
                    <label class="form-label">Enter OTP Code</label>
                    <input type="text" class="form-control otp-input" id="otp" maxlength="6" placeholder="000000">
                </div>
                
                <div id="timer" class="timer"></div>
                
                <button class="btn btn-primary" style="width: 100%;" onclick="verifyOTP()">Verify Email</button>
                <button class="btn btn-secondary" style="width: 100%; margin-top: 10px;" onclick="resendOTP()">Resend OTP</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        
        // Get email from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        let email = urlParams.get('email');
        
        if (!email) {
            email = localStorage.getItem('pending_verification_email');
        }
        
        if (!email) {
            window.location.href = 'register.html';
        }
        
        document.getElementById('userEmail').innerText = email;
        
        let timerInterval = null;
        let timeLeft = 60;
        
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type} show`;
            setTimeout(() => {
                alertDiv.classList.remove('show');
            }, 5000);
        }
        
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timeLeft = 60;
            
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timer').innerHTML = '⚠️ OTP expired! Please request a new one.';
                } else {
                    document.getElementById('timer').innerHTML = `⏱️ OTP valid for: ${timeLeft} seconds`;
                    timeLeft--;
                }
            }, 1000);
        }
        
        startTimer();
        
        async function verifyOTP() {
            const otp = document.getElementById('otp').value.trim();
            
            if (!otp || otp.length !== 6) {
                showAlert('Please enter valid 6-digit OTP', 'error');
                return;
            }
            
            showAlert('Verifying...', 'info');
            
            try {
                const response = await fetch(`${API_URL}/auth/verify-email`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, otp: otp })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showAlert(data.message, 'success');
                    localStorage.removeItem('pending_verification_email');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showAlert(data.error || 'Verification failed', 'error');
                }
            } catch (error) {
                showAlert('Network error. Please check if backend is running.', 'error');
            }
        }
        
        async function resendOTP() {
            showAlert('Resending OTP...', 'info');
            
            try {
                const response = await fetch(`${API_URL}/auth/resend-verification`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showAlert(data.message, 'success');
                    startTimer();
                } else {
                    showAlert(data.error || 'Failed to resend OTP', 'error');
                }
            } catch (error) {
                showAlert('Network error', 'error');
            }
        }
    </script>
</body>
</html>
