<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Crop Disease AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* ========== SAME COLORS AS REGISTER.HTML ========== */
    :root {
      --green-dark: #0f2b14;
      --green-primary: #2c6e2f;
      --green-light: #4c9a4a;
      --cream-bg: #FDF9F0;
      --sand: #e9e0d3;
      --stone: #5e4b3c;
      --gray-soft: #f5f2ec;
      --shadow-sm: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
      --transition: all 0.2s ease;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: url('https://images.pexels.com/photos/28589186/pexels-photo-28589186.jpeg?auto=compress&cs=tinysrgb&w=1600&h=900&dpr=1') center/cover no-repeat fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }
    
    /* Dark overlay like register page */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(20, 45, 18, 0.35) 0%, rgba(15, 31, 12, 0.75) 85%);
      z-index: 0;
    }
    
    body.np-font {
      font-family: 'Noto Sans Devanagari', sans-serif;
    }
    
    /* Language Toggle */
    .lang-switch {
      position: fixed;
      top: 20px;
      right: 20px;
      background: white;
      border-radius: 60px;
      padding: 8px 18px;
      font-size: 0.8rem;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      z-index: 1000;
      border: 1px solid #dad1c4;
      backdrop-filter: blur(4px);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }
    .lang-switch:hover {
      background: #f5f0e6;
      transform: translateY(-1px);
    }
    .lang-switch svg {
      width: 16px;
      height: 16px;
      color: var(--green-primary);
    }
    
    /* Login Card - Google Style */
    .login-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 32px 60px rgba(0,0,0,0.25);
      overflow: hidden;
    }
    
    .card-head {
      background: linear-gradient(145deg, var(--green-dark), var(--green-primary));
      padding: 2rem;
      text-align: center;
      color: #fff;
    }
    
    .logo-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      background: rgba(255,255,255,0.15);
      border-radius: 60px;
      margin-bottom: 1.2rem;
    }
    
    .logo-wrapper svg {
      width: 36px;
      height: 36px;
    }
    
    .card-head h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 0.25rem;
    }
    
    .card-head p {
      font-size: 0.85rem;
      opacity: 0.85;
    }
    
    .card-body {
      padding: 2rem;
    }
    
    .form-group {
      margin-bottom: 1.2rem;
    }
    
    .form-label {
      display: block;
      font-weight: 600;
      font-size: 0.82rem;
      margin-bottom: 6px;
      color: #3e2e22;
    }
    
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    
    .ico {
      position: absolute;
      left: 14px;
      color: #a2917c;
      font-size: 0.9rem;
      pointer-events: none;
    }
    
    .form-input {
      width: 100%;
      padding: 12px 42px 12px 40px;
      border: 1px solid #e2d9cf;
      border-radius: 18px;
      font-size: 0.9rem;
      background: white;
      transition: 0.2s;
    }
    
    .form-input:focus {
      border-color: var(--green-primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(44,110,47,0.1);
    }
    
    .show-pw {
      position: absolute;
      right: 16px;
      background: none;
      border: none;
      cursor: pointer;
      color: #9b8b78;
    }
    
    .show-pw:hover {
      color: var(--green-primary);
    }
    
    .field-error {
      font-size: 0.7rem;
      color: #d9433a;
      margin-top: 5px;
      margin-left: 8px;
    }
    
    .forgot-link {
      text-align: right;
      margin: -0.5rem 0 1.5rem;
    }
    
    .forgot-link a {
      font-size: 0.78rem;
      color: #7c6c5b;
      text-decoration: none;
    }
    
    .forgot-link a:hover {
      color: var(--green-primary);
      text-decoration: underline;
    }
    
    .btn {
      padding: 12px 20px;
      border-radius: 40px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.9rem;
      width: 100%;
    }
    
    .btn-primary {
      background: var(--green-primary);
      color: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    
    .btn-primary:hover {
      background: #1f5922;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(44,95,45,0.3);
    }
    
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 1.5rem 0;
      color: #a2917c;
      font-size: 0.78rem;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2d9cf;
    }
    
    .register-link {
      text-align: center;
      font-size: 0.82rem;
      color: #7c6c5b;
    }
    
    .register-link a {
      color: var(--green-primary);
      font-weight: 700;
      text-decoration: none;
    }
    
    .register-link a:hover {
      text-decoration: underline;
    }
    
    .alert {
      padding: 12px 16px;
      border-radius: 28px;
      margin-bottom: 1.2rem;
      font-size: 0.8rem;
      display: none;
    }
    
    .alert.success {
      background: #e5f5e1;
      border-left: 5px solid var(--green-primary);
      color: #1d4820;
      display: block;
    }
    
    .alert.error {
      background: #ffe6e4;
      border-left: 5px solid #d9534f;
      color: #a6241f;
      display: block;
    }
    
    .alert.warning {
      background: #fff3e0;
      border-left: 5px solid #f0ad4e;
      color: #856404;
      display: block;
    }
    
    @media (max-width: 520px) {
      .card-head { padding: 1.5rem; }
      .card-body { padding: 1.5rem; }
      .lang-switch { top: 12px; right: 12px; padding: 6px 14px; font-size: 0.75rem; }
      .logo-wrapper { width: 52px; height: 52px; }
      .logo-wrapper svg { width: 28px; height: 28px; }
      .card-head h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<!-- Language Toggle -->
<div class="lang-switch" id="langToggle">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M5 8l6 6"/><path d="M4 14l6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/>
    <path d="M22 22l-5-10-5 10"/><path d="M14 18h6"/>
  </svg>
  <span id="langBtnText">नेपाली</span>
</div>

<div class="login-card">
  <div class="card-head">
    <div class="logo-wrapper">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M16 28C16 28 6 22 6 13C6 8 10.48 4 16 4C21.52 4 26 8 26 13C26 22 16 28 16 28Z" fill="#ffffff" opacity=".9"/>
        <path d="M16 28C16 28 6 22 6 13C6 8 10.48 4 16 4" fill="#c8e6c9" opacity=".7"/>
        <line x1="16" y1="14" x2="16" y2="28" stroke="#2C5F2D" stroke-width="1.8"/>
        <line x1="16" y1="18" x2="12" y2="15" stroke="#2C5F2D" stroke-width="1.4"/>
        <line x1="16" y1="21" x2="20" y2="18" stroke="#2C5F2D" stroke-width="1.4"/>
      </svg>
    </div>
    <h1 data-lang-key="login_title">पुनः स्वागत छ</h1>
    <p data-lang-key="login_subtitle">आफ्नो खातामा साइन इन गर्नुहोस्</p>
  </div>
  
  <div class="card-body">
    <div id="alertMsg" class="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" data-lang-key="email_label">इमेल ठेगाना</label>
        <div class="input-wrap">
          <i class="fas fa-envelope ico"></i>
          <input type="email" id="email" class="form-input" data-lang-placeholder="email_placeholder" placeholder="farmer@example.com" autocomplete="email">
        </div>
        <div class="field-error" id="emailErr"></div>
      </div>

      <div class="form-group">
        <label class="form-label" data-lang-key="password_label">पासवर्ड</label>
        <div class="input-wrap">
          <i class="fas fa-lock ico"></i>
          <input type="password" id="password" class="form-input" data-lang-placeholder="password_placeholder" placeholder="तपाईंको पासवर्ड" autocomplete="current-password">
          <button type="button" class="show-pw" onclick="togglePw()"><i id="pwIcon" class="fas fa-eye"></i></button>
        </div>
        <div class="field-error" id="pwErr"></div>
      </div>

      <div class="forgot-link">
        <a href="/forgot-password" data-lang-key="forgot_password">पासवर्ड बिर्सनुभयो?</a>
      </div>

      <button type="submit" class="btn btn-primary" id="loginBtn">
        <span data-lang-key="login_button">साइन इन</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </form>

    <div class="divider"><span data-lang-key="or">वा</span></div>
    
    <div class="register-link">
      <span data-lang-key="no_account">खाता छैन?</span> 
      <a href="/register" data-lang-key="register_link">नयाँ बनाउनुहोस् →</a>
    </div>
  </div>
</div>

<script src="/statics/js/auth.js"></script>
<script src="/statics/js/shared.js"></script>

<script>
  // auth.js's redirectIfLoggedIn() reads the same localStorage keys
  // and routes by role — use it instead of a local duplicate.
  redirectIfLoggedIn();

  function togglePw() {
    const f = document.getElementById('password');
    const i = document.getElementById('pwIcon');
    f.type = f.type === 'password' ? 'text' : 'password';
    i.className = f.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
  }

  document.getElementById('langToggle').addEventListener('click', () => {
    if (typeof window.LangManager !== 'undefined') {
      const newLang = window.LangManager.currentLang === 'en' ? 'np' : 'en';
      window.LangManager.setLanguage(newLang);
    }
  });

  function updateLangButtonText() {
    const btnText = document.getElementById('langBtnText');
    if (btnText && typeof window.LangManager !== 'undefined') {
      btnText.innerText = window.LangManager.currentLang === 'en' ? 'नेपाली' : 'English';
    }
  }

  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const isEn = window.LangManager && window.LangManager.currentLang === 'en';
    
    document.getElementById('emailErr').textContent = '';
    document.getElementById('pwErr').textContent = '';

    if (!email) { 
      document.getElementById('emailErr').textContent = isEn ? 'Email is required' : 'इमेल आवश्यक छ'; 
      return; 
    }
    if (!password) { 
      document.getElementById('pwErr').textContent = isEn ? 'Password is required' : 'पासवर्ड आवश्यक छ'; 
      return; 
    }

    const btn = document.getElementById('loginBtn');
    const btnSpan = btn.querySelector('span');
    const originalText = btnSpan.textContent;
    btn.disabled = true; 
    btnSpan.textContent = isEn ? 'Signing in...' : 'साइन इन हुँदैछ...';

    try {
      const res = await fetch('/api/auth/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (res.ok) {
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('refresh_token', data.refresh_token);
        localStorage.setItem('user', JSON.stringify(data.user));
        showAlert('alertMsg', isEn ? 'Login successful! Redirecting...' : 'लगइन सफल! पुन: निर्देशित हुँदै...', 'success');
        setTimeout(() => { 
          window.location.href = data.user.role === 'admin' ? '/admin-dashboard' : '/user-dashboard'; 
        }, 1200);
      } else if (res.status === 403 && data.requires_verification) {
        showAlert('alertMsg', data.error || (isEn ? 'Please verify your email first.' : 'कृपया पहिले आफ्नो इमेल प्रमाणित गर्नुहोस्।'), 'warning');
        setTimeout(() => window.location.href = '/verify-email?email=' + encodeURIComponent(email), 2000);
      } else {
        showAlert('alertMsg', data.error || (isEn ? 'Invalid email or password' : 'अमान्य इमेल वा पासवर्ड'), 'error');
        btn.disabled = false; 
        btnSpan.textContent = originalText;
      }
    } catch {
      showAlert('alertMsg', isEn ? 'Network error. Please check your connection.' : 'नेटवर्क त्रुटि। कृपया आफ्नो कनेक्सन जाँच गर्नुहोस्।', 'error');
      btn.disabled = false; 
      btnSpan.textContent = originalText;
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    if (typeof window.LangManager !== 'undefined') {
      setTimeout(() => {
        updateLangButtonText();
      }, 100);
      window.addEventListener('languageChanged', updateLangButtonText);
    } else {
      console.error('shared.js not loaded! Check path: /statics/js/shared.js');
    }
  });
</script>
</body>
</html>
