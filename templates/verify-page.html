<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — Crop Disease AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/statics/css/style.css">
  <style>
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f1f12,#1a3520);padding:1.5rem;}
    .card{width:100%;max-width:420px;background:#fff;border-radius:28px;box-shadow:0 32px 60px rgba(0,0,0,.4);overflow:hidden;}
    .card-head{background:linear-gradient(145deg,#1a3520,#0f2814);padding:2rem;text-align:center;color:#fff;}
    .card-body{padding:2rem;}
  </style>
</head>
<body>
<div class="card">
  <div class="card-head"><div style="font-size:2.5rem;margin-bottom:.5rem;">📧</div><h1 style="font-size:1.4rem;font-weight:700;">Verify Your Email</h1><p style="opacity:.7;font-size:.85rem;margin-top:.2rem;" id="headSub">Enter the 6-digit code we sent you</p></div>
  <div class="card-body">
    <div id="alertMsg" class="alert"></div>
    <p style="font-size:.88rem;color:var(--gray-500);text-align:center;margin-bottom:1rem;">Code sent to <strong id="emailDisplay">your email</strong></p>
    <div class="otp-group">
      <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
      <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
      <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
      <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
      <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
      <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
    </div>
    <div id="timerTxt" style="text-align:center;font-size:.78rem;color:var(--gray-500);margin:.75rem 0;"></div>
    <button class="btn btn-primary btn-full" id="verBtn" onclick="verify()">Verify Email</button>
    <button class="btn btn-secondary btn-full" style="margin-top:8px;" onclick="resend()">Resend Code</button>
    <div style="text-align:center;margin-top:1.25rem;font-size:.82rem;color:var(--gray-500);"><a href="/login" style="color:var(--green-700);font-weight:600;">← Back to Login</a></div>
  </div>
</div>
<script src="/statics/js/auth.js"></script>
<script>
  const params=new URLSearchParams(location.search);
  const email=(params.get('email')||'').toLowerCase();
  if(email) document.getElementById('emailDisplay').textContent=email;
  const digits=Array.from(document.querySelectorAll('.otp-box'));
  let timerInt=null;

  digits.forEach((d,i)=>{
    d.addEventListener('input',e=>{const v=e.target.value.replace(/\D/g,'');e.target.value=v;if(v&&i<digits.length-1)digits[i+1].focus();});
    d.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!d.value&&i>0)digits[i-1].focus();});
    d.addEventListener('paste',e=>{e.preventDefault();const p=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'');p.split('').forEach((ch,j)=>{if(digits[i+j])digits[i+j].value=ch;});});
  });

  function startTimer(){
    clearInterval(timerInt);let t=300;
    const el=document.getElementById('timerTxt');
    const tick=()=>{const m=Math.floor(t/60),s=t%60;el.textContent=`Expires in ${m}:${String(s).padStart(2,'0')}`;el.style.color=t<=30?'var(--red-600)':'var(--gray-500)';if(t--<=0){clearInterval(timerInt);el.textContent='Code expired — resend.';document.getElementById('verBtn').disabled=true;} };
    tick();timerInt=setInterval(tick,1000);
  }
  startTimer();

  async function verify(){
    const code=digits.map(d=>d.value).join('');
    if(code.length!==6){showAlert('alertMsg','Enter all 6 digits.','error');return;}
    const res=await fetch('/api/auth/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,otp:code})});
    const d=await res.json();
    if(res.ok){clearInterval(timerInt);showAlert('alertMsg','Email verified! Redirecting…','success');setTimeout(()=>window.location.href='/login',1800);}
    else showAlert('alertMsg',d.error||'Verification failed.','error');
  }

  async function resend(){
    if(!email){showAlert('alertMsg','No email found. Please register again.','error');return;}
    const res=await fetch('/api/auth/resend-verification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const d=await res.json();
    if(res.ok){showAlert('alertMsg',d.message,'success');digits.forEach(d=>d.value='');digits[0].focus();document.getElementById('verBtn').disabled=false;startTimer();}
    else showAlert('alertMsg',d.error||'Could not resend.','error');
  }
</script>
</body></html>
