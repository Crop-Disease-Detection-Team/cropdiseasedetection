<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan History — Crop Disease AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* ========== SAME COLORS AS USER-DASHBOARD / REGISTER / LOGIN ========== */
    :root {
      --green-dark: #0f2b14;
      --green-primary: #2c6e2f;
      --green-light: #4c9a4a;
      --cream-bg: #FDF9F0;
      --sand: #e9e0d3;
      --stone: #5e4b3c;
      --gray-soft: #f5f2ec;
      --shadow-sm: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05);
      --transition: all 0.2s ease;
      --radius-xl: 24px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream-bg);
      color: var(--stone);
      min-height: 100vh;
    }

    body.np-font { font-family: 'Noto Sans Devanagari', sans-serif; }

    /* Language toggle — docked inline in the navbar's right-hand group,
       never position:fixed, so it can't overlap the hamburger menu.
       Same proven pattern as user-dashboard.html / admin-dashboard.html. */
    .lang-switch-inline {
      background: var(--gray-soft);
      border-radius: 60px;
      padding: 6px 12px;
      font-size: 0.72rem;
      font-weight: 600;
      border: 1px solid var(--sand);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      color: var(--stone);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .lang-switch-inline:hover { background: var(--sand); }
    .lang-switch-inline svg { width: 14px; height: 14px; color: var(--green-primary); flex-shrink: 0; }

    /* Navbar */
    .navbar {
      background: white;
      padding: 0.7rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--sand);
      position: sticky;
      top: 0;
      z-index: 99;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--green-primary);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: var(--stone);
      text-decoration: none;
      font-weight: 500;
      transition: var(--transition);
      font-size: 0.85rem;
    }

    .nav-links a:hover { color: var(--green-primary); }
    .nav-links a.active { color: var(--green-primary); font-weight: 700; }

    /* The right-hand cluster (lang toggle + hamburger menu) behaves as one
       rigid unit and never wraps its own children onto a second line —
       only .nav-links as a whole may wrap below this block. */
    .navbar-right-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: nowrap;
      flex-shrink: 0;
    }

    .menu-container { position: relative; flex-shrink: 0; }

    .hamburger-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--stone);
      padding: 4px 6px;
      flex-shrink: 0;
    }
    .hamburger-btn:hover { color: var(--green-primary); }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      background: white;
      border: 1px solid var(--sand);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      min-width: 190px;
      padding: 0.4rem 0;
      margin-top: 0.5rem;
      z-index: 100;
    }
    .dropdown-menu.show { display: block; }

    .dropdown-item {
      padding: 0.5rem 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      transition: var(--transition);
      color: var(--stone);
    }
    .dropdown-item:hover { background: var(--gray-soft); color: var(--green-primary); }
    .dropdown-item i { width: 18px; font-size: 0.85rem; }

    /* Container */
    .container { max-width: 1400px; margin: 1.5rem auto; padding: 0 1.5rem; }

    /* Card */
    .card {
      background: white;
      border-radius: var(--radius-md);
      border: 1px solid var(--sand);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .card-header {
      padding: 0.8rem 1.2rem;
      background: var(--green-primary);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .card-header span { font-weight: 700; font-size: 0.9rem; }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: var(--gray-soft); }
    th {
      text-align: left;
      padding: 1rem 1.5rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--stone);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--sand);
      white-space: nowrap;
    }
    td {
      padding: 1rem 1.5rem;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--sand);
      vertical-align: middle;
    }
    tbody tr { cursor: pointer; transition: var(--transition); }
    tbody tr:hover { background: var(--gray-soft); }
    tbody tr:last-child td { border-bottom: none; }

    /* Severity badge — same palette as user-dashboard.html's badges */
    .severity-badge {
      font-size: 0.72rem;
      padding: 4px 12px;
      border-radius: 50px;
      font-weight: 600;
      white-space: nowrap;
    }
    .severity-badge.high { background: #fef2f2; color: #991b1b; }
    .severity-badge.medium { background: #fefce8; color: #854d0e; }
    .severity-badge.low { background: #f0fdf4; color: #166534; }

    /* Pagination */
    .pagination {
      display: flex;
      gap: 4px;
      justify-content: center;
      padding: 0.8rem;
      flex-wrap: wrap;
    }
    .page-btn {
      padding: 4px 10px;
      border: 1px solid var(--sand);
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 0.75rem;
      transition: var(--transition);
    }
    .page-btn:hover { background: var(--gray-soft); }
    .page-btn.active { background: var(--green-primary); color: white; border-color: var(--green-primary); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: white;
      border-radius: var(--radius-xl);
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .modal-header h3 { font-weight: 700; font-size: 1.1rem; color: var(--green-dark); }
    .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--stone); }
    .modal-close:hover { color: var(--green-primary); }

    .detail-row { display: flex; padding: 0.5rem 0; border-bottom: 1px solid var(--sand); }
    .detail-key { width: 120px; font-weight: 600; font-size: 0.82rem; color: var(--stone); opacity: 0.7; flex-shrink: 0; }
    .detail-val { flex: 1; font-size: 0.82rem; }

    /* Loading */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.8);
      z-index: 999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .loading-overlay.show { display: flex; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--sand);
      border-top-color: var(--green-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-txt { margin-top: 0.75rem; font-size: 0.85rem; color: var(--stone); }

    /* Alert */
    .alert {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      margin-bottom: 1rem;
      font-size: 0.8rem;
      display: none;
    }
    .alert.success { background: #e8f5e9; border-left: 4px solid var(--green-primary); color: #1e4620; display: block; }
    .alert.error { background: #fef2f2; border-left: 4px solid #dc2626; color: #991b1b; display: block; }

    /* Buttons */
    .btn {
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      text-decoration: none;
    }
    .btn-sm { padding: 6px 12px; font-size: 0.78rem; }
    .btn-primary { background: var(--green-primary); color: white; }
    .btn-primary:hover { background: #1f5922; transform: translateY(-1px); }
    .btn-secondary { background: var(--gray-soft); color: var(--stone); }
    .btn-secondary:hover { background: var(--sand); }
    .btn-danger { background: #fef2f2; color: #991b1b; }
    .btn-danger:hover { background: #fee2e2; }

    @media (max-width: 560px) {
      .lang-switch-inline span { display: none; }
      .lang-switch-inline { padding: 6px 8px; }
      .navbar { padding: 0.6rem 1rem; }
      .container { padding: 0 1rem; }
    }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="logo"> CropDisease AI</div>
  <div class="nav-links">
    <a href="/user-dashboard" data-lang-key="nav_dashboard">Dashboard</a>
    <a href="/predict" data-lang-key="nav_detect">Detect</a>
    <a href="/history" class="active" data-lang-key="nav_history">History</a>
    <div class="navbar-right-group">
      <div class="lang-switch-inline" id="langToggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 8l6 6"/><path d="M4 14l6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/>
          <path d="M22 22l-5-10-5 10"/><path d="M14 18h6"/>
        </svg>
        <span id="langBtnText">नेपाली</span>
      </div>
      <div class="menu-container">
        <button class="hamburger-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
        <div class="dropdown-menu" id="dropMenu">
          <div class="dropdown-item" onclick="confirmDeleteAll()"><i class="fas fa-trash-alt"></i><span data-lang-key="hist_clear_all_history">Clear All History</span></div>
          <div class="dropdown-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span data-lang-key="logout">Logout</span></div>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="container">
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem;">
    <div>
      <h1 style="font-size:1.6rem;font-weight:700;color:var(--green-900);"><span data-lang-key="hist_title">Scan History</span></h1>
      <p style="color:var(--gray-500);font-size:.9rem;margin-top:.25rem;" data-lang-key="hist_subtitle">All your past disease detections</p>
    </div>
    <button class="btn btn-danger btn-sm" onclick="confirmDeleteAll()"><i class="fas fa-trash"></i> <span data-lang-key="hist_clear_all">Clear All</span></button>
  </div>
  <div id="alertMsg" class="alert"></div>

  <div class="card">
    <div class="card-header">
      <span data-lang-key="hist_detection_records">Detection Records</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <input type="text" id="searchInp" data-lang-placeholder="hist_search_placeholder" placeholder="🔍 Search disease…" oninput="applyFilters()"
          style="padding:6px 12px;border-radius:20px;border:none;font-size:.82rem;width:180px;">
        <select id="sevFilter" onchange="applyFilters()"
          style="padding:6px 12px;border-radius:20px;border:none;font-size:.82rem;">
          <option value="" data-lang-key="hist_all_severities">All Severities</option>
          <option value="High" data-lang-key="hist_sev_high">High</option>
          <option value="Medium" data-lang-key="hist_sev_medium">Medium</option>
          <option value="Low" data-lang-key="hist_sev_low">Low</option>
        </select>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th data-lang-key="hist_col_num">#</th>
          <th data-lang-key="hist_col_disease">Disease</th>
          <th data-lang-key="hist_col_crop">Crop</th>
          <th data-lang-key="hist_col_severity">Severity</th>
          <th data-lang-key="hist_col_date">Date</th>
        </tr></thead>
        <tbody id="histBody"><tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--gray-500);" data-lang-key="loading">Loading…</td></tr></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal" id="detailModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle" data-lang-key="hist_scan_detail">Scan Detail</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="loading-overlay" id="loader" style="display:none;"><div class="spinner"></div><div class="loading-txt" data-lang-key="loading">Loading…</div></div>

<script src="/statics/js/auth.js"></script>
<script src="/statics/js/shared.js"></script>
<script>
  requireAuth('user');
  let allScans = [], filtered = [], currentPage = 1;
  const PER = 10;

  // ---------- Language toggle ----------
  document.getElementById('langToggle').addEventListener('click', () => {
    if (typeof window.LangManager !== 'undefined') {
      const newLang = window.LangManager.currentLang === 'en' ? 'np' : 'en';
      window.LangManager.setLanguage(newLang);
    }
  });
  function updateLangButtonText() {
    const btnText = document.getElementById('langBtnText');
    if (btnText && typeof window.LangManager !== 'undefined') {
      btnText.innerText = window.LangManager.currentLang === 'en' ? 'नेपाली' : 'English';
    }
  }
  // shared.js dispatches 'langApplied' whenever the language switches.
  // Re-render the table (and the open modal, if any) since their content
  // is built in JS template literals and data-lang-key alone can't reach
  // text baked into those strings at render time.
  window.addEventListener('langApplied', () => {
    updateLangButtonText();
    render();
    if (document.getElementById('detailModal').classList.contains('open') && lastOpenedIdx !== null) {
      openDetail(lastOpenedIdx);
    }
  });

  async function load() {
    document.getElementById('loader').style.display = 'flex';
    try {
      const res = await authFetch('/api/history?per_page=500');
      if (!res) return;
      const d = await res.json();
      allScans = d.scans || [];
      filtered = [...allScans];
      render();
    } catch {
      showAlert('alertMsg', t('network_error'), 'error');
    } finally {
      document.getElementById('loader').style.display = 'none';
    }
  }

  function applyFilters() {
    const s = document.getElementById('searchInp').value.toLowerCase();
    const sv = document.getElementById('sevFilter').value;
    filtered = allScans.filter(x =>
      (!s || (x.disease_name||'').toLowerCase().includes(s)) &&
      (!sv || (x.severity||'').toLowerCase() === sv.toLowerCase())
    );
    currentPage = 1; render();
  }

  function render() {
    const tbody = document.getElementById('histBody');
    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:2.5rem;color:var(--gray-500);"><i class="fas fa-search" style="font-size:1.5rem;opacity:.4;display:block;margin-bottom:.75rem;"></i>${esc(t('hist_no_records'))}</td></tr>`;
      document.getElementById('pagination').innerHTML = ''; return;
    }
    const start = (currentPage-1)*PER;
    const page = filtered.slice(start, start+PER);
    tbody.innerHTML = page.map((s,i) => {
      const name = (s.disease_name||t('hist_unknown_disease')).replace(/___/g,' — ').replace(/_/g,' ');
      const crop = (s.disease_name||'').split('___')[0].replace(/_/g,' ');
      return `<tr onclick="openDetail(${start+i})">
        <td style="color:var(--gray-300);font-size:.8rem;">${start+i+1}</td>
        <td><strong style="color:var(--green-900);">${esc(name)}</strong></td>
        <td style="color:var(--gray-500);font-size:.85rem;">${esc(crop)}</td>
        <td>${severityBadge(s.severity)}</td>
        <td style="color:var(--gray-500);font-size:.82rem;">${fmtDate(s.scanned_at)}</td>
      </tr>`;
    }).join('');

    const pages = Math.ceil(filtered.length/PER);
    let pHtml = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
    for (let i=1;i<=pages;i++) pHtml += `<button class="page-btn${i===currentPage?' active':''}" onclick="goPage(${i})">${i}</button>`;
    pHtml += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>›</button>`;
    document.getElementById('pagination').innerHTML = pHtml;
  }

  function goPage(p) { if(p<1||p>Math.ceil(filtered.length/PER))return; currentPage=p; render(); }

  let lastOpenedIdx = null;
  function openDetail(idx) {
    lastOpenedIdx = idx;
    const s = filtered[idx];
    const name = (s.disease_name||t('hist_unknown_disease')).replace(/___/g,' — ').replace(/_/g,' ');
    const conf = typeof s.confidence === 'number' ? (s.confidence < 1 ? (s.confidence*100).toFixed(1) : s.confidence.toFixed(1)) : '—';
    document.getElementById('modalTitle').textContent = name;
    document.getElementById('modalBody').innerHTML = `
      <div class="detail-row"><div class="detail-key">${esc(t('hist_detail_disease'))}</div><div class="detail-val">${esc(name)}</div></div>
      <div class="detail-row"><div class="detail-key">${esc(t('hist_detail_confidence'))}</div><div class="detail-val">${conf}%</div></div>
      <div class="detail-row"><div class="detail-key">${esc(t('hist_detail_severity'))}</div><div class="detail-val">${severityBadge(s.severity)}</div></div>
      <div class="detail-row"><div class="detail-key">${esc(t('hist_detail_scanned_on'))}</div><div class="detail-val">${fmtDateTime(s.scanned_at)}</div></div>
      ${s.recommendation ? `<div class="detail-row"><div class="detail-key">${esc(t('hist_detail_recommendation'))}</div><div class="detail-val">${esc(s.recommendation)}</div></div>` : ''}
      <div style="margin-top:1rem;display:flex;gap:8px;flex-wrap:wrap;">
        <a href="/predict" class="btn btn-primary btn-sm"><i class="fas fa-camera"></i> ${esc(t('hist_scan_again'))}</a>
        <button onclick="closeModal()" class="btn btn-secondary btn-sm">${esc(t('hist_close'))}</button>
      </div>`;
    document.getElementById('detailModal').classList.add('open');
  }
  function closeModal() { document.getElementById('detailModal').classList.remove('open'); lastOpenedIdx = null; }
  document.getElementById('detailModal').addEventListener('click', e => { if(e.target===e.currentTarget)closeModal(); });

  async function confirmDeleteAll() {
    if (!confirm(t('hist_confirm_delete_all'))) return;
    document.getElementById('loader').style.display = 'flex';
    try {
      const res = await authFetch('/api/history', {method:'DELETE'});
      if (!res) return;
      if (res.ok) { showAlert('alertMsg', t('hist_all_deleted'), 'success'); allScans=[]; filtered=[]; render(); }
      else { const d = await res.json(); showAlert('alertMsg', d.error || t('ud_failed_generic'),'error'); }
    } catch {
      showAlert('alertMsg', t('network_error'), 'error');
    } finally {
      document.getElementById('loader').style.display = 'none';
    }
  }

  const mb = document.getElementById('menuBtn'), dm = document.getElementById('dropMenu');
  mb.addEventListener('click', e=>{e.stopPropagation();dm.classList.toggle('show');});
  document.addEventListener('click', ()=>dm.classList.remove('show'));

  document.addEventListener('DOMContentLoaded', () => {
    if (typeof window.LangManager !== 'undefined') {
      setTimeout(updateLangButtonText, 100);
    }
  });

  load();
</script>
</body>
</html>
